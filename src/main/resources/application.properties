# ===============================
# = SERVER
# ===============================
server.port=8080

# Force UTF-8 for responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ===============================
# = DATABASE (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=hospital
spring.datasource.password=hospitalpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# = JPA (if using it)
# ===============================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# = JWT
# ===============================
# Must be at least 32 bytes for HS256/HS384
jwt.secret=change-me-to-a-random-very-long-256-bit-secret-key!!!
jwt.expiration-ms=86400000

# ===============================
# = ACTUATOR (optional)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO